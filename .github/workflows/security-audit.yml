name: Scheduled Security Audit

on:
  schedule:
    - cron: '0 6 * * 1'  # every Monday at 06:00 UTC
  workflow_dispatch:      # lets you trigger it manually to test

permissions:
  contents: read
  issues: write

jobs:
  cargo-audit:
    name: cargo audit (contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: contract

  npm-audit:
    name: npm audit (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, keeper, frontend, docs]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: npm ci
      - uses: oke-py/npm-audit-action@v4
        with:
          audit_level: moderate
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: ${{ matrix.component }}
          issue_labels: security,dependencies
          dedupe_issues: true