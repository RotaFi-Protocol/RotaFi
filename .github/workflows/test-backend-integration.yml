name: Backend Integration Tests

on:
  workflow_dispatch:
  schedule:
    # Daily at 06:00 UTC to catch testnet contract drift.
    - cron: '0 6 * * *'
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/test-backend-integration.yml'
  pull_request:
    branches: [master]
    paths:
      - 'backend/**'

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run Soroban testnet integration tests
        working-directory: backend
        env:
          SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          RUN_INTEGRATION_TESTS: 'true'
        run: npm run test:integration
